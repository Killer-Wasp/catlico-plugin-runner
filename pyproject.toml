[project]
name = "catlico-plugin-runner"
version = "0.1.0"
description = "Plugin runner service: hosts plugins, distributes events, manages sandbox execution."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "catlico-plugin-sdk",
    "httpx>=0.27",
    "prometheus-client>=0.25.0",
    "pydantic-settings>=2.14.1",
    "starlette>=0.46",
    "uvicorn>=0.34",
]

[project.scripts]
plugin-runner = "plugin_runner.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plugin_runner"]

[tool.uv.sources]
catlico-plugin-sdk = { path = "../catlico-plugin-sdk" }

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
