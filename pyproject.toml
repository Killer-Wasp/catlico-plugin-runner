[project]
name = "catlico-plugin-runner"
version = "0.1.0"
description = "Plugin runner service: hosts plugins, distributes events, manages sandbox execution."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "catlico-plugin-sdk",
    "httpx>=0.27",
    "prometheus-client>=0.25.0",
    "pydantic-settings>=2.14.1",
    "starlette>=0.46",
    "uvicorn>=0.34",
]

[project.scripts]
plugin-runner = "plugin_runner.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plugin_runner"]

[tool.uv.sources]
# Editable so the runner always resolves the live sibling SDK checkout (dev + tests
# exercise the SDK-under-development, not a stale copied wheel). Production images
# resolve the SDK from the plugin lockfiles (git pin / index), not this source.
catlico-plugin-sdk = { path = "../catlico-plugin-sdk", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "slow: exercises real uv/venv operations (may hit the network); deselect with -m 'not slow'",
]
